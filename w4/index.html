<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友對我的動態留言板 | 二次元虛擬牆</title>

    <!-- Google Fonts: Orbitron (科技感字體) & Noto Sans TC (繁體中文) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================
           1. 全局變數與風格設定 (配色、字體)
           若要調整主題顏色，可修改以下 CSS 變數：
        ========================================================== */
        :root {
            /* 主色調：青藍 (Cyan) */
            --primary-cyan: #00f3ff;
            /* 次色調：霓虹粉 (Neon Pink) */
            --primary-pink: #ff0055;
            /* 輔助色：紫羅蘭 (Purple) */
            --accent-purple: #9d00ff;
            /* 背景深灰/深藍 */
            --bg-dark: #080814;
            --card-bg: rgba(16, 18, 38, 0.85);
            /* 輪播間隔時間控制 (預設 3 秒 = 3000ms) */
            --carousel-speed: 3000ms;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            /* 背景掃描線效果 (Scanlines) */
            background-image: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
        }

        /* 頂部標題區 */
        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
            z-index: 2;
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            margin-bottom: 8px;
        }

        .header-subtitle {
            color: #8a8ab0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* 容器層 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* ==========================================================
           2. 載入中動畫 (Loading Animation)
        ========================================================== */
        #loading-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 20px;
        }

        /* 雙色旋轉光環 */
        .spinner {
            width: 70px;
            height: 70px;
            border: 4px solid transparent;
            border-top-color: var(--primary-cyan);
            border-bottom-color: var(--primary-pink);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            filter: drop-shadow(0 0 10px var(--primary-cyan));
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .loading-text {
            color: var(--primary-cyan);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse-text 1.5s infinite ease-in-out;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--primary-cyan); }
        }

        /* ==========================================================
           3. 瀑布流排版 (Masonry Layout)
        ========================================================== */
        .masonry-wall {
            /* 預設桌機 3 欄 */
            column-count: 3;
            column-gap: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* 平板版本 (2 欄) */
        @media (max-width: 900px) {
            .masonry-wall {
                column-count: 2;
            }
        }

        /* 手機版本 (1 欄) */
        @media (max-width: 600px) {
            .masonry-wall {
                column-count: 1;
            }
        }

        /* ==========================================================
           4. 留言卡片樣式與輪播高亮 (Highlight Animation)
        ========================================================== */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
            /* 防止卡片在瀑布流中被截斷 */
            break-inside: avoid;
            position: relative;
            backdrop-filter: blur(8px);
            /* 多邊形科技感切角 */
            clip-path: polygon(
                0 0, 
                calc(100% - 12px) 0, 
                100% 12px, 
                100% 100%, 
                0 100%
            );
            /* 平滑過渡供焦點切換 */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        box-shadow 0.4s ease,
                        filter 0.4s ease,
                        opacity 0.4s ease,
                        border-color 0.4s ease;
        }

        /* 預設非焦點卡片的稍微變暗特效 */
        .masonry-wall.carousel-active .card:not(.highlight) {
            opacity: 0.45;
            filter: blur(1.5px) grayscale(30%);
            transform: scale(0.97);
        }

        /* 被輪播選中的【高亮卡片 (Highlight)】 */
        .card.highlight {
            opacity: 1 !important;
            filter: blur(0) grayscale(0%) !important;
            transform: scale(1.05) translateY(-5px) !important;
            border-color: var(--primary-pink);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6),
                        0 0 10px rgba(0, 243, 255, 0.4),
                        inset 0 0 15px rgba(255, 0, 85, 0.2);
            z-index: 10;
        }

        /* 被選中卡片的角標閃爍 */
        .card.highlight::after {
            content: "✦ FOCUS";
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--primary-pink);
            letter-spacing: 1px;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; text-shadow: 0 0 5px var(--primary-pink); }
        }

        /* 卡片頭部：姓名與時間 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-b: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .author-name {
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .author-name i {
            color: var(--primary-pink);
            font-size: 0.85rem;
        }

        .timestamp {
            font-size: 0.75rem;
            color: #6c6c8e;
            font-family: monospace;
        }

        /* 卡片留言內容 */
        .card-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e0ff;
            word-break: break-word;
            white-space: pre-wrap; /* 保留多行分段 */
        }
    </style>
</head>
<body>

    <header>
        <h1 class="header-title">VIRTUAL MESSAGE WALL</h1>
        <p class="header-subtitle">// 朋友對我的動態悄悄話留言牆 //</p>
    </header>

    <div class="container">
        <!-- 1. 讀取中動畫區塊 -->
        <div id="loading-view">
            <div class="spinner"></div>
            <div class="loading-text">讀取留言中...</div>
        </div>

        <!-- 2. 瀑布流卡片牆 -->
        <div id="message-wall" class="masonry-wall"></div>
    </div>

    <!-- JavaScript 邏輯實作 -->
    <script>
        // ==========================================================
        // 控制參數與設定 (方便後續微調)
        // ==========================================================
        // Google 試算表 CSV 網址
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTJA7LIJThpt68A1psepo32BdlASQWQln8k4iMVtSwKR42DK5ZybYwvQX6WPhzNwdIIKtQNYd7otb5_/pub?output=csv';
        
        // 輪播切換間隔時間 (單位：毫秒，3000ms = 3 秒)
        const CAROUSEL_INTERVAL_MS = 3000;

        // 全局變數
        let currentIndex = 0;       // 當前高亮的卡片索引
        let totalCards = 0;          // 總卡片數量
        let carouselTimer = null;    // 輪播計時器

        // DOM 元素引用
        const loadingView = document.getElementById('loading-view');
        const messageWall = document.getElementById('message-wall');

        // ==========================================================
        // 核心邏輯：頁面載入與資料 Fetch
        // ==========================================================
        document.addEventListener('DOMContentLoaded', () => {
            fetchCSVData();
        });

        // 讀取 CSV 檔
        async function fetchCSVData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const csvText = await response.text();
                const parsedData = parseCSV(csvText);

                // 移除標題列 (Header: 時間戳記, 名字, 悄悄話)
                const messages = parsedData.slice(1).filter(row => row.length >= 3 && row[1].trim() !== '');

                renderWall(messages);
            } catch (error) {
                console.error('資料載入失敗:', error);
                loadingView.innerHTML = `
                    <div style="color: var(--primary-pink); text-align: center;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <p>留言牆資料載入失敗，請稍後再試。</p>
                    </div>
                `;
            }
        }

        // ==========================================================
        // 健壯的 CSV 解析器 (妥善處理留言內容包含逗號與換行)
        // ==========================================================
        function parseCSV(str) {
            const arr = [];
            let quote = false; // 是否在雙引號內部
            let col = '';
            let row = [];

            for (let c = 0; c < str.length; c++) {
                const cc = str[c];
                const nc = str[c + 1];

                if (cc === '"') {
                    if (quote && nc === '"') { // 轉義的引號 ""
                        col += '"';
                        c++;
                    } else {
                        quote = !quote; // 切換引號狀態
                    }
                } else if (cc === ',' && !quote) { // 遇到真正的逗號分隔符
                    row.push(col);
                    col = '';
                } else if ((cc === '\r' || cc === '\n') && !quote) { // 遇到換行
                    if (cc === '\r' && nc === '\n') {
                        c++;
                    }
                    row.push(col);
                    col = '';
                    if (row.some(field => field.trim() !== '')) {
                        arr.push(row);
                    }
                    row = [];
                } else {
                    col += cc;
                }
            }

            if (col || row.length > 0) {
                row.push(col);
                if (row.some(field => field.trim() !== '')) {
                    arr.push(row);
                }
            }

            return arr;
        }

        // ==========================================================
        // 渲染牆面與卡片生成
        // ==========================================================
        function renderWall(dataList) {
            // 隱藏載入畫面
            loadingView.style.display = 'none';

            if (dataList.length === 0) {
                messageWall.innerHTML = '<p style="text-align: center; color: #8a8ab0; column-span: all;">目前還沒有任何留言喔！</p>';
                messageWall.style.opacity = '1';
                return;
            }

            // 清空牆面
            messageWall.innerHTML = '';

            // 生成卡片
            dataList.forEach((item, index) => {
                const [timestamp, name, content] = item;

                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-header">
                        <span class="author-name">
                            <i class="fa-solid fa-user-astronaut"></i> ${escapeHTML(name)}
                        </span>
                        <span class="timestamp">${escapeHTML(formatTime(timestamp))}</span>
                    </div>
                    <div class="card-body">${escapeHTML(content)}</div>
                `;

                messageWall.appendChild(card);
            });

            // 顯示牆面
            messageWall.style.opacity = '1';

            totalCards = dataList.length;

            // 啟動 3 秒輪播 Highlight 特效
            if (totalCards > 0) {
                messageWall.classList.add('carousel-active');
                startCarousel();
            }
        }

        // ==========================================================
        // 輪播 Highlight 特效控制
        // ==========================================================
        function startCarousel() {
            // 先高亮第一張卡片
            highlightCard(currentIndex);

            // 設定計時器：每隔 CAROUSEL_INTERVAL_MS 毫秒執行一次
            carouselTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % totalCards;
                highlightCard(currentIndex);
            }, CAROUSEL_INTERVAL_MS);
        }

        function highlightCard(index) {
            const cards = messageWall.querySelectorAll('.card');

            cards.forEach((card, idx) => {
                if (idx === index) {
                    card.classList.add('highlight');
                    
                    // 視狀況平滑滾動到高亮卡片（對行動裝置瀏覽體驗更好）
                    card.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'nearest'
                    });
                } else {
                    card.classList.remove('highlight');
                }
            });
        }

        // ==========================================================
        // 工具函式 (XSS 防護與時間格式化)
        // ==========================================================
        function escapeHTML(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTime(rawTime) {
            if (!rawTime) return '';
            // 若包含日期時間，嘗試做精簡格式化（如只需要 MM/DD HH:mm）
            const parts = rawTime.split(' ');
            return parts.length > 1 ? parts[0] : rawTime;
        }
    </script>
</body>
